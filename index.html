  <style>
    :root {
      --font-manrope: 'Manrope', sans-serif;
    }

    body {
      font-family: var(--font-manrope);
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* --- 2026 Liquid Glass & Aurora --- */
    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.6;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      animation: fluidMove 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform, border-radius;
    }

    .blob-1 {
      top: -15%;
      left: -15%;
      width: 60vw;
      height: 60vh;
      background: radial-gradient(circle, #0f766e 0%, transparent 60%);
      animation-delay: 0s;
    }

    .blob-2 {
      bottom: -15%;
      right: -15%;
      width: 60vw;
      height: 60vh;
      background: radial-gradient(circle, #0ea5e9 0%, transparent 60%);
      animation-delay: -5s;
    }

    .blob-3 {
      top: 40%;
      left: 40%;
      width: 45vw;
      height: 45vh;
      background: radial-gradient(circle, #6366f1 0%, transparent 60%);
      animation-delay: -10s;
    }

    @keyframes fluidMove {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }

      33% {
        transform: translate(30px, -50px) scale(1.1) rotate(5deg);
        border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%;
      }

      66% {
        transform: translate(-20px, 20px) scale(0.9) rotate(-5deg);
        border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%;
      }

      100% {
        transform: translate(10px, -10px) scale(1) rotate(0deg);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
    }

    /* --- Neoskeuomorphic Glass --- */
    .glass-panel {
      background: rgba(15, 23, 42, 0.60);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      /* Inner light + heavy shadow */
      box-shadow:
        0 4px 6px -1px rgba(0, 0, 0, 0.1),
        0 2px 4px -1px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
    }

    .glass-button {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      box-shadow:
        4px 4px 10px rgba(0, 0, 0, 0.2),
        -4px -4px 10px rgba(255, 255, 255, 0.02),
        inset 1px 1px 1px rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .glass-button:active {
      transform: scale(0.98);
      box-shadow: inset 4px 4px 10px rgba(0, 0, 0, 0.2);
    }

    .glass-button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* --- Animations --- */
    .animate-float-in {
      animation: floatIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    .animate-delay-100 {
      animation-delay: 100ms;
    }

    .animate-delay-200 {
      animation-delay: 200ms;
    }

    .animate-delay-300 {
      animation-delay: 300ms;
    }

    @keyframes floatIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- Custom Scrollbar for Install Toast --- */
    .install-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(150%);
      z-index: 50;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgba(10, 15, 30, 0.85);
      /* Darker glass */
    }

    .install-toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* --- Temporada: Halloween (24 de octubre – 2 de noviembre) -----------------
       Solo cambian los tres blobs del fondo y el acento del título: calabaza y
       violeta en vez de teal y azul, con la misma luminosidad para no alterar el
       contraste del texto encima. La píldora de estado conserva su verde, ámbar
       y rojo: son colores de significado, no de decoración.
       Se enciende y se apaga sola; ver aplicarTemporada(). */
    :root.temporada-halloween .blob-1 {
      background: radial-gradient(circle, #c2410c 0%, transparent 60%);
    }

    :root.temporada-halloween .blob-2 {
      background: radial-gradient(circle, #6d28d9 0%, transparent 60%);
    }

    :root.temporada-halloween .blob-3 {
      background: radial-gradient(circle, #b45309 0%, transparent 60%);
    }

    /* Ámbar sólido en vez del degradado: en temporada el acento pesa por color,
       no por efecto. */
    :root.temporada-halloween #tituloAccent {
      background-image: none;
      color: #fbbf24;
      -webkit-text-fill-color: #fbbf24;
    }

    .calabaza {
      display: none;
      flex-shrink: 0;
      color: #f59e0b;
    }

    :root.temporada-halloween .calabaza {
      display: block;
    }

    /* --- Despliegue de sub-opciones bajo "Maestro" y "Contratos" (grid-rows 0fr→1fr) --- */
    #empresas,
    #contratosEmp {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows .35s cubic-bezier(.2, .8, .2, 1), opacity .3s, margin .35s;
    }

    #empresas.open,
    #contratosEmp.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: .25rem;
    }

    #empresas > div,
    #contratosEmp > div {
      overflow: hidden;
    }

    #btnMaestro .chev,
    #btnContratos .chev {
      transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }

    #btnMaestro.open .chev,
    #btnContratos.open .chev {
      transform: rotate(90deg);
    }
  </style>

  </script>
  <script>
    // Temporada de Halloween: del 24 de octubre al 2 de noviembre, cualquier año.
    // Va en el <head> para que la clase exista antes del primer pintado.
    (function aplicarTemporada() {
      const hoy = new Date(), mes = hoy.getMonth() + 1, dia = hoy.getDate();
      if ((mes === 10 && dia >= 24) || (mes === 11 && dia <= 2)) {
        document.documentElement.classList.add('temporada-halloween');
      }
    })();
  </script>

  <script>
    // ==============================
    // 🔧 CONFIGURACIÓN
    // ==============================
    // Version constant. MUST match service-worker.js (CACHE_VERSION),
    // maestro.html (CONFIG.version, #appVersion span) and the "v..." text at the bottom.
    const APP_VERSION = 'v2.5.11';
    const CACHE_NAME = `riopaila-maestro-${APP_VERSION}`;
    let deferredPrompt = null;

    // ==============================
    // 🔧 Registro del Service Worker
    // ==============================
    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        updateStatus('warning', 'Navegador no compatible');
        return;
      }

      try {
        const registration = await navigator.serviceWorker.register('service-worker.js');

        if (registration.installing) {
          // Guardar el worker: al pasar a 'activated' registration.installing ya es null.
          const sw = registration.installing;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'activated') verifyCacheStatus();
          });
        } else {
          verifyCacheStatus();
        }

        // Silent auto-update (matches maestro.html policy): when a new SW is installed
        // alongside an active one, skip waiting and reload once it takes control.
        if (registration.waiting) {
          registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        }

        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });

      } catch (err) {
        console.error('[SW] Error:', err);
        updateStatus('error', 'Error de instalación');
      }
    }

    // Reload once the new worker takes control, so the fresh assets are served.
    if ('serviceWorker' in navigator) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!reloading) {
          reloading = true;
          window.location.reload();
        }
      });
    }

    // ==============================
    // 📱 VERIFICACIÓN DE CACHÉ
    // ==============================
    async function verifyCacheStatus() {
      try {
        await navigator.serviceWorker.ready;
        const cache = await caches.open(CACHE_NAME);
        const keys = await cache.keys();

        if (keys.length > 3) {
          updateStatus('success', 'Listo para usar offline');
        } else {
          updateStatus('sync', 'Descargando recursos...');
          // Forzar un pequeño delay para que se vea la animación si es muy rápido
          setTimeout(() => {
            if (keys.length < 3) updateStatus('warning', 'Instalación pendiente');
            else updateStatus('success', 'Listo para usar offline');
          }, 2000);
        }
      } catch (err) {
        updateStatus('error', 'Error de caché');
      }
    }

    // ==============================
    // 📊 UI UPDATES
    // ==============================
    function updateStatus(type, message) {
      const icon = document.getElementById('statusIcon');
      const text = document.getElementById('statusText');
      const div = document.getElementById('installStatus');
      const ping = div.querySelector('.animate-ping'); // Find the ping animation to hide/show/color

      text.textContent = message;

      // Default State
      div.className = 'absolute top-8 animate-float-in glass-panel px-4 py-2 rounded-full flex items-center gap-3 transition-all duration-300 border border-transparent';
      icon.className = 'hidden material-symbols-outlined text-[16px]';
      if (ping) ping.className = 'animate-ping absolute inline-flex h-full w-full rounded-full opacity-75';

      switch (type) {
        case 'success':
          // Green/Teal
          div.classList.add('border-teal-500/30', 'bg-teal-500/5');
          text.classList.add('text-teal-400');
          if (ping) ping.classList.add('bg-teal-400');
          div.querySelector('.relative.inline-flex').classList.add('bg-teal-500');
          break;
        case 'warning':
          // Amber/Yellow
          div.classList.add('border-amber-500/30', 'bg-amber-500/5');
          text.classList.remove('text-slate-300');
          text.classList.add('text-amber-400');
          if (ping) ping.classList.add('bg-amber-400');
          div.querySelector('.relative.inline-flex').classList.remove('bg-teal-500');
          div.querySelector('.relative.inline-flex').classList.add('bg-amber-500');
          break;
        case 'error':
          // Red
          div.classList.add('border-red-500/30', 'bg-red-500/5');
          text.classList.remove('text-slate-300');
          text.classList.add('text-red-400');
          if (ping) ping.classList.add('bg-red-400');
          div.querySelector('.relative.inline-flex').classList.remove('bg-teal-500');
          div.querySelector('.relative.inline-flex').classList.add('bg-red-500');
          break;
        default: // sync
          // Blue/Slate (Default)
          text.classList.add('text-slate-300');
          if (ping) ping.classList.add('bg-sky-400');
          div.querySelector('.relative.inline-flex').classList.remove('bg-teal-500');
          div.querySelector('.relative.inline-flex').classList.add('bg-sky-500');
      }
    }

    // ==============================
    // 📱 PWA INSTALL
    // ==============================
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installToast').classList.add('show');
    });

    function dismissInstall() {
      document.getElementById('installToast').classList.remove('show');
    }

    async function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          updateStatus('success', 'App instalada');
        }
        deferredPrompt = null;
        dismissInstall();
      }
    }

    // ==============================
    // 🧹 UTILS
    // ==============================
    async function clearCache() {
      if (!confirm('¿Seguro que deseas borrar los datos y reiniciar?')) return;

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) await registration.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        localStorage.clear();
        sessionStorage.clear();
        window.location.reload();
      } catch (err) {
        alert('Error al limpiar');
      }
    }

    function verifyInstallation() {
      updateStatus('sync', 'Verificando...');
      verifyCacheStatus();
    }

    // ==============================
    // 🗂️ MENÚ: Maestro / Contratos
    // ==============================
    // Maestro despliega las dos empresas debajo; cada empresa navega como antes.
    function toggleMaestro() {
      const btn = document.getElementById('btnMaestro');
      const emp = document.getElementById('empresas');
      const abierto = emp.classList.toggle('open');
      btn.classList.toggle('open', abierto);
      btn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
      // Al abrir uno, cierra el otro para no apilar dos listas largas.
      if (abierto) cerrarContratos();
    }

    // Contratos despliega las 4 empresas; cada una abre maestro.html?view=contratos&cemp=...
    function toggleContratos() {
      const btn = document.getElementById('btnContratos');
      const emp = document.getElementById('contratosEmp');
      const abierto = emp.classList.toggle('open');
      btn.classList.toggle('open', abierto);
      btn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
      if (abierto) cerrarMaestro();
    }

    function cerrarMaestro() {
      const btn = document.getElementById('btnMaestro');
      const emp = document.getElementById('empresas');
      if (emp) emp.classList.remove('open');
      if (btn) { btn.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    }

    function cerrarContratos() {
      const btn = document.getElementById('btnContratos');
      const emp = document.getElementById('contratosEmp');
      if (emp) emp.classList.remove('open');
      if (btn) { btn.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
    }

    // INIT
    document.addEventListener('DOMContentLoaded', () => {
      if (!navigator.onLine) updateStatus('warning', 'Modo Offline');
      registerServiceWorker();
    });

    window.addEventListener('online', () => {
      updateStatus('success', 'Conexión restaurada');
      verifyCacheStatus();
    });

    window.addEventListener('offline', () => updateStatus('warning', 'Modo Offline'));
  </script>
</body>

</html>
